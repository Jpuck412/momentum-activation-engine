[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-activation-engine"
version = "0.1.0"
description = "Real-Time Small-Cap Runner Detector with AI Analysis"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.1",
    "pandas>=2.0.3",
    "numpy>=1.24.3",
    "yfinance>=0.2.28",
    "plotly>=5.17.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
]

[project.urls]
Homepage = "https://github.com/Jpuck412/momentum-activation-engine"
Repository = "https://github.com/Jpuck412/momentum-activation-engine"
